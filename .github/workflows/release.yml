# Builds SoheiDesk installers for macOS, Windows, and Linux.
#
# Trigger:
#   - Push tag: git tag v1.1.0 && git push origin v1.1.0
#   - Or Actions → "Build all platforms" → Run workflow
#
# Download: finished run → Artifacts → soheidesk-macos / windows / linux

name: Build all platforms

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # version comes from package.json "packageManager" (do not set version: here)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal macOS app + dmg
        run: pnpm tauri build --target universal-apple-darwin

      - name: Collect macOS artifacts
        run: |
          mkdir -p dist-artifacts
          find src-tauri/target -type f -name '*.dmg' 2>/dev/null | head -20
          cp -v src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist-artifacts/ 2>/dev/null || true
          cp -v src-tauri/target/release/bundle/dmg/*.dmg dist-artifacts/ 2>/dev/null || true
          if [ -d src-tauri/target/universal-apple-darwin/release/bundle/macos/SoheiDesk.app ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              src-tauri/target/universal-apple-darwin/release/bundle/macos/SoheiDesk.app \
              dist-artifacts/SoheiDesk-macos-universal.app.zip
          elif [ -d src-tauri/target/release/bundle/macos/SoheiDesk.app ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              src-tauri/target/release/bundle/macos/SoheiDesk.app \
              dist-artifacts/SoheiDesk-macos.app.zip
          fi
          ls -lah dist-artifacts || true

      - uses: actions/upload-artifact@v4
        with:
          name: soheidesk-macos
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installers
        run: pnpm tauri build

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          Get-ChildItem -Path src-tauri\target\release\bundle -Recurse -Include *.msi,*.exe |
            ForEach-Object { Copy-Item $_.FullName -Destination dist-artifacts\ }
          Get-ChildItem dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: soheidesk-windows
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps
        run: |
          # libappindicator3-dev conflicts with libayatana-appindicator3-dev on Ubuntu 22.04+
          # Tauri docs: use ayatana only
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            libfuse2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux packages
        run: pnpm tauri build

      - name: Collect Linux artifacts
        run: |
          mkdir -p dist-artifacts
          find src-tauri/target/release/bundle -type f \( \
            -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
          \) -exec cp -v {} dist-artifacts/ \;
          ls -lah dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: soheidesk-linux
          path: dist-artifacts/*
          if-no-files-found: error
          retention-days: 30
